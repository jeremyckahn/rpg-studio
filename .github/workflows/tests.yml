name: Tests

# Every commit pushed to any branch runs the unit tests and the full browser suite. Pull requests from forks are
# covered by the pull_request trigger, since their pushes happen in the fork. A pull request from
# a branch of this repository is skipped there (see FROM_FORK below): its commits are pushes, so
# it would only run everything twice.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer run for the same branch or pull request makes the older one pointless.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    # FROM_FORK: run for pushes and manual runs, and for pull requests only when the head is a fork.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest for every package, plus the checks that keep the documentation true.
      - name: Run the unit tests
        run: pnpm test

  e2e:
    name: Playwright (Chromium, shard ${{ matrix.shard }}/4)
    # FROM_FORK: run for pushes and manual runs, and for pull requests only when the head is a fork.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Let every shard finish, so one failure does not hide the others.
      fail-fast: false
      matrix:
        # The whole suite takes the best part of half an hour on one runner, so it is split in four.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests run against the production build, which needs the engine player built first.
      - name: Build the libraries and the engine player
        run: pnpm build

      - name: Build the editor app
        run: pnpm build:app

      - name: Install Chromium
        run: pnpm --filter @rpgstudio/e2e exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

      # Traces, screenshots and videos of failures, plus the HTML report.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # One check with a stable name to require in branch protection, whatever the number of shards.
  tests-passed:
    name: All tests passed
    # Same condition as the shards, so a skipped pull_request run reports skipped, not failed.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: The unit tests and every shard must have passed
        run: test "${{ needs.unit.result }}" = "success" && test "${{ needs.e2e.result }}" = "success"
