name: End-to-end tests

# Every commit pushed to any branch, and every pull request, runs the full browser suite.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer run for the same branch or pull request makes the older one pointless.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (Chromium, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Let every shard finish, so one failure does not hide the others.
      fail-fast: false
      matrix:
        # The whole suite takes the best part of half an hour on one runner, so it is split in four.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests run against the production build, which needs the engine player built first.
      - name: Build the libraries and the engine player
        run: pnpm build

      - name: Build the editor app
        run: pnpm build:app

      - name: Install Chromium
        run: pnpm --filter @rpgstudio/e2e exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4

      # Traces, screenshots and videos of failures, plus the HTML report.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # One check with a stable name to require in branch protection, whatever the number of shards.
  e2e-passed:
    name: End-to-end tests passed
    if: ${{ always() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Every shard must have passed
        run: test "${{ needs.e2e.result }}" = "success"
